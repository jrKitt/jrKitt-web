<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070d1d"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(6, 182, 212, 0.07)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Ambient light -->
  <circle cx="700" cy="80" r="180" fill="#0284c7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="160" fill="#075985" opacity="0.06" filter="url(#glow)"/>

  <!-- Top bar / Window chrome -->
  <rect x="40" y="36" width="720" height="408" rx="14" fill="#0b1122" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2"/>
  <rect x="40" y="36" width="720" height="42" rx="14" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="68" cy="57" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="86" cy="57" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="104" cy="57" r="5" fill="#10b981" opacity="0.8"/>

  <rect x="250" y="46" width="300" height="22" rx="6" fill="#040711" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>
  <text x="400" y="61" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">jrkitt.dev // eds</text>

  <!-- Content panel inside -->
  <g transform="translate(70, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(6, 182, 212, 0.12)" stroke="#0284c7" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#0284c7"/>
    <text x="26" y="17" fill="#0284c7" font-family="monospace" font-weight="bold" font-size="10.5" letter-spacing="1.2">PORTAL • LARAVEL</text>

    <!-- Title & Subtitle -->
    <text x="0" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">EDS Udonthani Tech</text>
    <text x="0" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">School & Curriculum Management</text>

    <!-- Visual telemetry / Stat blocks -->
    <g transform="translate(0, 135)">
      
        <g transform="translate(0, 0)">
          <rect width="200" height="80" rx="10" fill="#080e1d" stroke="rgba(56, 189, 248, 0.14)" stroke-width="1"/>
          <text x="16" y="32" fill="#64748b" font-family="monospace" font-size="11" text-transform="uppercase">Students</text>
          <text x="16" y="62" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="20">2,100</text>
        </g>
      
        <g transform="translate(220, 0)">
          <rect width="200" height="80" rx="10" fill="#080e1d" stroke="rgba(56, 189, 248, 0.14)" stroke-width="1"/>
          <text x="16" y="32" fill="#64748b" font-family="monospace" font-size="11" text-transform="uppercase">Courses</text>
          <text x="16" y="62" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="20">140</text>
        </g>
      
        <g transform="translate(440, 0)">
          <rect width="200" height="80" rx="10" fill="#080e1d" stroke="rgba(56, 189, 248, 0.14)" stroke-width="1"/>
          <text x="16" y="32" fill="#64748b" font-family="monospace" font-size="11" text-transform="uppercase">Uptime</text>
          <text x="16" y="62" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="20">99.9%</text>
        </g>
      
    </g>

    <!-- Bottom code line preview -->
    <g transform="translate(0, 245)">
      <rect width="660" height="50" rx="8" fill="#040711" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>
      <circle cx="20" cy="25" r="3" fill="#22d3ee"/>
      <text x="34" y="29" fill="#0ea5e9" font-family="monospace" font-size="12">status</text>
      <text x="82" y="29" fill="#94a3b8" font-family="monospace" font-size="12">: verified_and_deployed</text>
      <text x="560" y="29" fill="#64748b" font-family="monospace" font-size="11">system_ok</text>
    </g>
  </g>
</svg>